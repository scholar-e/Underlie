<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Player — Showcase</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #0f0f1a; color: #ddd; line-height: 1.5;
  min-height: 100vh;
}
header {
  background: linear-gradient(135deg, #1a1a3e, #16213e);
  padding: 20px 24px; border-bottom: 1px solid #2a2a4a;
}
header h1 { font-size: 20px; font-weight: 600; color: #fff; }
header .sub { font-size: 13px; color: #8888aa; }
.run-meta {
  display: flex; gap: 24px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: #666;
}
.run-meta span { white-space: nowrap; }
.run-meta .label { color: #555; }
.run-meta .val { color: #aab; font-weight: 500; }
main {
  display: flex; gap: 24px; max-width: 1200px; margin: 24px auto; padding: 0 24px;
}
@media (max-width: 860px) { main { flex-direction: column; align-items: center; } }

.board-col { flex-shrink: 0; }
.board-wrap {
  background: #16213e; border-radius: 12px; padding: 20px 20px 16px;
  border: 1px solid #2a2a4a; display: inline-block;
}
.board-row { display: flex; align-items: center; }
.rank-labels {
  display: flex; flex-direction: column; justify-content: space-around;
  padding: 0 5px; font-size: 11px; color: #555; width: 14px;
  align-items: center; height: 384px;
}
.chess-board {
  display: grid;
  grid-template-columns: repeat(8, 48px);
  grid-template-rows: repeat(8, 48px);
  border: 2px solid #2a2a4a; border-radius: 4px; overflow: hidden;
}
.sq {
  width: 48px; height: 48px; display: flex; align-items: center;
  justify-content: center; font-size: 34px; line-height: 1; user-select: none;
}
.sq.l { background: #f0d9b5; }
.sq.d { background: #b58863; }
.sq.hl { box-shadow: inset 0 0 0 3px #ffd700; }
.sq .wp { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.sq .bp { color: #1a1a2e; text-shadow: 0 0 2px rgba(255,255,255,.3); }
.file-labels {
  display: flex; justify-content: space-around; padding: 3px 0 0; font-size: 11px; color: #555;
}
.file-labels span { width: 48px; text-align: center; }

.side-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.panel {
  background: #16213e; border-radius: 10px; padding: 16px;
  border: 1px solid #2a2a4a;
}
.panel h3 { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: .8px; margin-bottom: 8px; }

.step-info { display: flex; gap: 20px; flex-wrap: wrap; font-size: 13px; }
.step-info .pair { display: flex; gap: 6px; }
.step-info .lbl { color: #666; }
.step-info .vl { color: #ddd; font-weight: 500; }
.reward-badge {
  display: inline-block; padding: 1px 8px; border-radius: 8px; font-size: 12px;
}
.reward-badge.pos { background: #1a3a2a; color: #4ecdc4; }
.reward-badge.neg { background: #3a1a1a; color: #ff6b6b; }
.reward-badge.z { background: #2a2a3a; color: #777; }

.history-box {
  font-family: "SF Mono", "Fira Code", monospace; font-size: 12px; line-height: 1.8;
  max-height: 120px; overflow-y: auto; color: #999;
}
.history-box .hl-move { color: #dda; font-weight: 600; }
.history-box .num { color: #555; }

.reasoning-box {
  font-size: 13px; line-height: 1.7; color: #bbb;
  max-height: 220px; overflow-y: auto; white-space: pre-wrap;
}
.reasoning-box .step-tag {
  display: inline-block; font-size: 10px; color: #555;
  background: #1a1a2e; padding: 1px 6px; border-radius: 3px; margin-bottom: 4px;
}

.nav { display: flex; align-items: center; gap: 10px; justify-content: center; }
.nav button {
  font-family: inherit; font-size: 13px; padding: 7px 18px;
  border-radius: 6px; border: 1px solid #2a2a4a; background: #1a1a3e;
  color: #ccc; cursor: pointer; transition: all .12s;
}
.nav button:hover { background: #2a2a5e; border-color: #4361ee; color: #fff; }
.nav button:disabled { opacity: .3; cursor: not-allowed; }
.nav .pos { font-size: 13px; color: #666; min-width: 80px; text-align: center; }

.load-area {
  margin-top: 12px; padding: 12px; border: 1px dashed #2a2a4a;
  border-radius: 8px; text-align: center; font-size: 12px; color: #555;
  cursor: pointer; transition: all .12s;
}
.load-area:hover { border-color: #4361ee; color: #888; }
.load-area input { display: none; }

@media (max-width: 600px) {
  .chess-board { grid-template-columns: repeat(8, 36px); grid-template-rows: repeat(8, 36px); }
  .sq { width: 36px; height: 36px; font-size: 26px; }
  .rank-labels { height: 288px; }
}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
    <h1>♚ Chess Player</h1>
    <select id="runSelect" style="font-family:inherit;font-size:12px;padding:4px 8px;border-radius:5px;border:1px solid #2a2a4a;background:#1a1a3e;color:#aaa;max-width:320px">
      <option value="">— Select run —</option>
    </select>
  </div>
  <div class="sub" id="subtitle">Loading...</div>
  <div class="run-meta" id="runMeta"></div>
</header>
<main id="main"></main>

<script>
const PIECES = {
  'K':'♚','Q':'♛','R':'♜','B':'♝','N':'♞','P':'♟',
  'k':'♚','q':'♛','r':'♜','b':'♝','n':'♞','p':'♟',
};
const FILES = ['a','b','c','d','e','f','g','h'];
const RANKS = ['8','7','6','5','4','3','2','1'];

let replay = null, episodes = [], curEp = 0, curStep = 0;
let runIndex = [];

function fenToBoard(f) {
  const pos = f.split(' ')[0], ranks = pos.split('/'), board = [];
  for (const r of ranks) {
    const row = [];
    for (const ch of r) {
      if (ch >= '1' && ch <= '8') for (let i=0; i<parseInt(ch); i++) row.push(null);
      else row.push(ch);
    }
    board.push(row);
  }
  return board;
}

function getMove(s) {
  if (!s || !s.action) return null;
  const m = s.action.match(/MOVE:\s*(\S+)/i);
  return m ? m[1] : s.action.trim();
}

function render() {
  const steps = episodes[curEp];
  const s = steps[curStep];
  const obs = s.observation || {};
  const fen = obs.fen || '';

  const board = fenToBoard(fen);
  const hl = getMove(s);
  const hlSq = hl ? (hl.match(/[a-h][1-8]/) || [null])[0] : null;
  let html = '';
  for (let r=0; r<8; r++) {
    for (let f=0; f<8; f++) {
      const light = (r+f)%2===0;
      const sq = FILES[f] + RANKS[r];
      const piece = board[r][f];
      html += `<div class="sq ${light?'l':'d'}${sq===hlSq?' hl':''}">`;
      if (piece) {
        html += `<span class="${piece===piece.toUpperCase()?'wp':'bp'}">${PIECES[piece]||piece}</span>`;
      }
      html += '</div>';
    }
  }

  const info = s.info || {};
  const rew = s.reward;
  const rewCls = rew > 0 ? 'pos' : rew < 0 ? 'neg' : 'z';

  // Build move history
  let histHtml = '';
  const allMoves = [];
  for (let i=0; i<=curStep; i++) {
    const san = getMove(steps[i]);
    if (san) allMoves.push(san);
  }
  if (allMoves.length) {
    const pairs = [];
    for (let i=0; i<allMoves.length; i+=2) {
      const n = Math.floor(i/2)+1;
      pairs.push(`<span class="num">${n}.</span> ${allMoves[i]||'...'}${allMoves[i+1]?' '+allMoves[i+1]:''}`);
    }
    histHtml = pairs.join('  ');
  }

  // Build reasoning
  const reasoning = (s.reasoning || '').trim();
  const model = replay?.run?.config?.agent_config?.model || 'model';

  const episodeSelector = episodes.length > 1 ? `
    <div style="margin-bottom:12px;display:flex;gap:10px;align-items:center">
      <select id="epSelect" style="font-family:inherit;font-size:13px;padding:5px 10px;border-radius:6px;border:1px solid #2a2a4a;background:#1a1a3e;color:#ccc">
        ${episodes.map((_,i)=>`<option value="${i}"${i===curEp?' selected':''}>Game ${i+1}</option>`).join('')}
      </select>
    </div>
  ` : '';

  const main = document.getElementById('main');
  main.innerHTML = episodeSelector + `
    <div class="board-col">
      <div class="board-wrap">
        <div class="board-row">
          <div class="rank-labels">${RANKS.map(r=>`<span>${r}</span>`).join('')}</div>
          <div>
            <div class="chess-board">${html}</div>
            <div class="file-labels">${FILES.map(f=>`<span>${f}</span>`).join('')}</div>
          </div>
        </div>
      </div>
    </div>
    <div class="side-col">
      <div class="panel">
        <h3>Turn ${s.step}</h3>
        <div class="step-info">
          <div class="pair"><span class="lbl">To move</span><span class="vl">${obs.turn||'?'}</span></div>
          <div class="pair"><span class="lbl">Action</span><span class="vl" style="font-family:monospace">${getMove(s)||'—'}</span></div>
          <div class="pair"><span class="lbl">Reward</span><span class="vl"><span class="reward-badge ${rewCls}">${rew!=null?rew.toFixed(2):'—'}</span></span></div>
          ${info.stockfish_cp_delta!=null?`<div class="pair"><span class="lbl">CP delta</span><span class="vl">${info.stockfish_cp_delta>=0?'+':''}${info.stockfish_cp_delta}</span></div>`:''}
          <div class="pair"><span class="lbl">Status</span><span class="vl">${s.terminated?'Game over':s.truncated?'Truncated':steps.length===curStep+1?'Last step':'Playing'}</span></div>
        </div>
      </div>

      <div class="panel">
        <h3>Moves</h3>
        <div class="history-box">${histHtml||'—'}</div>
      </div>

      <div class="panel" style="flex:1">
        <h3>Model reasoning <span style="font-weight:400;text-transform:none;color:#666">${model.split('/').pop()}</span></h3>
        <div class="reasoning-box">${reasoning ? `<span class="step-tag">Step ${s.step}</span>\n${escHtml(reasoning)}` : '<span style="color:#555">No reasoning recorded</span>'}</div>
      </div>

      <div class="nav">
        <button id="startBtn" ${curStep===0?'disabled':''}>⏮</button>
        <button id="prevBtn" ${curStep===0?'disabled':''}>← Prev</button>
        <span class="pos">${curStep+1} / ${steps.length}</span>
        <button id="nextBtn" ${curStep>=steps.length-1?'disabled':''}>Next →</button>
        <button id="endBtn" ${curStep>=steps.length-1?'disabled':''}>⏭</button>
      </div>

      <div class="load-area" id="loadArea">📂 Load another replay file</div>
      <input type="file" id="fileInput" accept=".json">
    </div>
  `;

  document.getElementById('prevBtn')?.addEventListener('click',()=>{if(curStep>0){curStep--;render();}});
  document.getElementById('nextBtn')?.addEventListener('click',()=>{if(curStep<steps.length-1){curStep++;render();}});
  document.getElementById('startBtn')?.addEventListener('click',()=>{curStep=0;render();});
  document.getElementById('endBtn')?.addEventListener('click',()=>{curStep=steps.length-1;render();});
  document.getElementById('epSelect')?.addEventListener('change',e=>{curEp=parseInt(e.target.value);curStep=0;render();});
  document.getElementById('loadArea')?.addEventListener('click',()=>document.getElementById('fileInput')?.click());
  document.getElementById('fileInput')?.addEventListener('change', async e => {
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      const text = await file.text();
      if (!loadReplayData(JSON.parse(text))) throw new Error('No episodes found');
    } catch(err) {
      alert('Invalid replay file: ' + err.message);
    }
    e.target.value = '';
  });
}

function escHtml(s) {
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

function updateMeta() {
  const run = replay.run || {};
  const cfg = run.config || {};
  document.getElementById('runMeta').innerHTML = `
    <span><span class="label">Model</span> <span class="val">${cfg.agent_config?.model||'?'}</span></span>
    <span><span class="label">Episodes</span> <span class="val">${Object.keys(replay.replay||{}).length}</span></span>
    <span><span class="label">Steps</span> <span class="val">${Object.values(replay.replay||{})[0]?.length||'?'}</span></span>
    <span><span class="label">Avg reward</span> <span class="val">${run.scores?.mean_episode_reward?.toFixed(2)||'?'}</span></span>
    <span><span class="label">Status</span> <span class="val">${run.status||'?'}</span></span>
  `;
  document.getElementById('subtitle').textContent = `${replay.domain_name||'Chess'} — ${run.status||''}`;
}

function loadReplayData(data) {
  replay = data;
  const replayData = replay.replay || {};
  const keys = Object.keys(replayData);
  if (!keys.length) {
    document.getElementById('main').innerHTML = '<div style="padding:40px;text-align:center;color:#666"><h2>No episodes in replay</h2></div>';
    return false;
  }
  episodes = keys.map(k => replayData[k]);
  curEp = 0; curStep = 0;
  updateMeta();
  render();
  return true;
}

async function loadRun(file) {
  try {
    const r = await fetch('data/runs/' + file);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    loadReplayData(data);
  } catch(e) {
    document.getElementById('main').innerHTML = '<div style="padding:40px;text-align:center;color:#666"><h2>Failed to load run</h2><p>' + escHtml(e.message) + '</p></div>';
  }
}

function populateRunSelect(selectedId) {
  const sel = document.getElementById('runSelect');
  sel.innerHTML = '<option value="">— Select run —</option>';
  for (const r of runIndex) {
    const opt = document.createElement('option');
    opt.value = r.id;
    opt.textContent = r.label + (r.model ? ' (' + r.model.split('/').pop() + ')' : '');
    if (r.id === selectedId) opt.selected = true;
    sel.appendChild(opt);
  }
  sel.onchange = () => {
    const id = sel.value;
    if (!id) return;
    document.getElementById('subtitle').textContent = 'Loading...';
    document.getElementById('runMeta').innerHTML = '';
    const entry = runIndex.find(e => e.id === id);
    if (entry) loadRun(entry.file);
  };
}

async function init() {
  let selectedId = null;
  try {
    const idxResp = await fetch('data/runs/index.json');
    if (idxResp.ok) {
      runIndex = await idxResp.json();
      if (runIndex.length) {
        selectedId = runIndex[0].id;
        populateRunSelect(selectedId);
        document.getElementById('subtitle').textContent = 'Select a run above';
        await loadRun(runIndex[0].file);
        return;
      }
    }
  } catch(e) {}

  // Fallback: try legacy replay.json
  for (const p of ['data/replay.json','replay.json','../showcase/data/replay.json']){
    try {
      const r = await fetch(p);
      if (r.ok) { replay = await r.json(); break; }
    } catch(e) {}
  }
  if (!replay) {
    document.getElementById('main').innerHTML = '<div style="padding:40px;text-align:center;color:#666"><h2>No replay data</h2><p>Place replay files in <code>data/runs/</code> and add them to <code>data/runs/index.json</code>, or export with:</p><p style="margin-top:12px"><code>mesocosm run export RUN_ID -o showcase/data/runs/name.json</code></p><p style="margin-top:12px">Then add an entry to <code>data/runs/index.json</code>.</p></div>';
    return;
  }
  loadReplayData(replay);
}

document.addEventListener('keydown', e => {
  if (e.key==='ArrowLeft') document.getElementById('prevBtn')?.click();
  if (e.key==='ArrowRight') document.getElementById('nextBtn')?.click();
  if (e.key==='Home') document.getElementById('startBtn')?.click();
  if (e.key==='End') document.getElementById('endBtn')?.click();
});

init();
</script>
</body>
</html>
