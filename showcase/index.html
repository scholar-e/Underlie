<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Player — Showcase</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #1a1a2e; color: #e0e0f0; line-height: 1.5;
  min-height: 100vh; display: flex; flex-direction: column;
}
header {
  background: #16213e; padding: 20px 24px; border-bottom: 1px solid #2a2a4a;
}
header h1 { font-size: 20px; font-weight: 600; }
header .subtitle { font-size: 13px; color: #8888aa; }
header .run-info { font-size: 12px; color: #666; margin-top: 4px; }
main {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  padding: 24px; max-width: 920px; margin: 0 auto; width: 100%;
}
.board-section {
  background: #16213e; border-radius: 12px; padding: 24px 24px 20px;
  border: 1px solid #2a2a4a; width: 100%;
}
.board-row { display: flex; align-items: center; gap: 0; }
.coord-rank {
  display: flex; flex-direction: column; justify-content: space-around;
  padding: 0 6px; font-size: 11px; color: #666; width: 16px;
  align-items: center; height: 384px;
}
.chess-board {
  display: grid;
  grid-template-columns: repeat(8, 48px);
  grid-template-rows: repeat(8, 48px);
  border: 2px solid #2a2a4a; border-radius: 4px; overflow: hidden;
}
.square {
  width: 48px; height: 48px;
  display: flex; align-items: center; justify-content: center;
  font-size: 34px; line-height: 1; user-select: none;
}
.square .wp { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5), 0 0 3px rgba(0,0,0,.3); }
.square .bp { color: #1a1a2e; text-shadow: 0 0 2px rgba(255,255,255,.3); }
.square .wp, .square .bp { font-weight: 500; }
.square.light { background: #f0d9b5; }
.square.dark { background: #b58863; }
.square.highlight { box-shadow: inset 0 0 0 3px #ffd700; }
.coord-file {
  display: flex; justify-content: space-around; padding: 4px 0 0;
  font-size: 11px; color: #666;
}
.coord-file span { width: 48px; text-align: center; }
.info-panel { margin-top: 16px; }
.info-row { display: flex; gap: 20px; margin-bottom: 6px; font-size: 14px; }
.info-label { color: #8888aa; min-width: 70px; }
.info-value { font-weight: 500; color: #e0e0f0; }
.history-line {
  font-size: 13px; color: #a0a0c0; margin-top: 8px;
  padding: 8px 12px; background: #0f2040; border-radius: 6px;
  font-family: "SF Mono", "Fira Code", monospace;
}
.reasoning {
  margin-top: 12px; padding: 12px 16px; background: #0f3460;
  border-radius: 8px; font-size: 13.5px; line-height: 1.7;
  color: #c0c0e0; border-left: 3px solid #4361ee;
  max-height: 200px; overflow-y: auto;
}
.reasoning::before {
  content: "Model reasoning"; display: block;
  font-size: 11px; color: #8888aa; margin-bottom: 6px;
  font-weight: 600; text-transform: uppercase; letter-spacing: .5px;
}
nav {
  display: flex; align-items: center; gap: 12px;
  margin-top: 20px; justify-content: center; flex-wrap: wrap;
}
nav button {
  font-family: inherit; font-size: 13px; padding: 8px 20px;
  border-radius: 6px; border: 1px solid #2a2a4a; background: #16213e;
  color: #e0e0f0; cursor: pointer; transition: all .15s;
}
nav button:hover { background: #0f3460; border-color: #4361ee; }
nav button:disabled { opacity: .4; cursor: not-allowed; }
.step-indicator { font-size: 14px; color: #8888aa; min-width: 100px; text-align: center; }
.reward-badge {
  display: inline-block; padding: 2px 10px; border-radius: 10px;
  font-size: 12px; font-weight: 600;
}
.reward-badge.pos { background: #1a3a2a; color: #4ecdc4; }
.reward-badge.neg { background: #3a1a1a; color: #ff6b6b; }
.reward-badge.zero { background: #2a2a3a; color: #8888aa; }
.episode-select {
  font-family: inherit; font-size: 13px; padding: 6px 12px;
  border-radius: 6px; border: 1px solid #2a2a4a; background: #16213e;
  color: #e0e0f0; cursor: pointer;
}
.no-replay { text-align: center; padding: 60px 20px; color: #8888aa; }
.no-replay h2 { margin-bottom: 12px; }
@media (max-width: 600px) {
  .chess-board { grid-template-columns: repeat(8, 36px); grid-template-rows: repeat(8, 36px); }
  .square { width: 36px; height: 36px; font-size: 26px; }
  .coord-rank { height: 288px; }
}
</style>
</head>
<body>
<header>
  <h1>♚ Chess Player</h1>
  <div class="subtitle">Model showcase — BenchAnything replay</div>
  <div class="run-info" id="runInfo"></div>
</header>
<main id="mainContent">
  <div class="no-replay" id="loadingState">
    <h2>Loading replay...</h2>
  </div>
</main>

<script>
const PIECES = {
  'K': '♔','Q': '♕','R': '♖','B': '♗','N': '♘','P': '♙',
  'k': '♚','q': '♛','r': '♜','b': '♝','n': '♞','p': '♟',
};
const FILES = ['a','b','c','d','e','f','g','h'];
const RANKS = ['8','7','6','5','4','3','2','1'];

let replay = null;
let episodes = [];
let currentEp = 0;
let currentStep = 0;

function fenToBoard(fen) {
  const pos = fen.split(' ')[0], ranks = pos.split('/'), board = [];
  for (const rank of ranks) {
    const row = [];
    for (const ch of rank) {
      if (ch >= '1' && ch <= '8') for (let i=0; i<parseInt(ch); i++) row.push(null);
      else row.push(ch);
    }
    board.push(row);
  }
  return board;
}

function extractMove(action) {
  if (!action) return null;
  const m = action.match(/MOVE:\s*(\S+)/i);
  return m ? m[1] : action.trim();
}

function renderBoard(fen, action) {
  if (!fen) return '<div style="color:#666;padding:20px">No board data</div>';
  const board = fenToBoard(fen);
  const lastSan = extractMove(action);
  const hl = lastSan ? (lastSan.match(/[a-h][1-8]/) || [null])[0] : null;
  let html = '';
  for (let r=0; r<8; r++) {
    for (let f=0; f<8; f++) {
      const light = (r + f) % 2 === 0;
      const sq = FILES[f] + RANKS[r];
      const piece = board[r][f];
      html += `<div class="square ${light?'light':'dark'}${sq===hl?' highlight':''}">`;
      if (piece) {
        const cls = piece === piece.toUpperCase() ? 'wp' : 'bp';
        html += `<span class="${cls}">${PIECES[piece] || piece}</span>`;
      }
      html += '</div>';
    }
  }
  return html;
}

function buildHistory(steps, idx) {
  const moves = [];
  for (let i = 0; i <= idx; i++) {
    const san = extractMove(steps[i].action);
    if (san) moves.push(san);
  }
  if (!moves.length) return '';
  const pairs = [];
  for (let i = 0; i < moves.length; i += 2) {
    const n = Math.floor(i/2) + 1;
    const w = moves[i] || '...';
    const b = moves[i+1] || '';
    pairs.push(`${n}. ${w}${b ? ' ' + b : ''}`);
  }
  return pairs.join('  ');
}

function statusLabel(s) {
  if (s.terminated) return '🏁 Game over';
  if (s.truncated) return '✂️ Truncated (max steps)';
  return '▶️ In progress';
}

function renderStepUI() {
  const steps = episodes[currentEp];
  const s = steps[currentStep];
  const obs = s.observation || {};
  const fen = obs.fen || '';

  const boardHtml = renderBoard(fen, s.action);
  const coords = RANKS.map(r => `<span>${r}</span>`).join('');
  const files = FILES.map(f => `<span>${f}</span>`).join('');

  const turn = obs.turn || '?';
  const rew = s.reward;
  const rewCls = rew > 0 ? 'pos' : rew < 0 ? 'neg' : 'zero';
  const actionDisplay = extractMove(s.action) || s.action || '—';
  const cpDelta = s.info ? s.info.stockfish_cp_delta : null;

  let historyHtml = '';
  if (currentStep >= 0) {
    historyHtml = buildHistory(steps, currentStep);
  }

  document.getElementById('mainContent').innerHTML = `
    <div class="board-section">
      <div class="board-row">
        <div class="coord-rank">${coords}</div>
        <div>
          <div class="chess-board">${boardHtml}</div>
          <div class="coord-file">${files}</div>
        </div>
      </div>
      <div class="info-panel">
        <div class="info-row">
          <span class="info-label">Turn</span>
          <span class="info-value">${turn}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Move</span>
          <span class="info-value">#${s.step}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Action</span>
          <span class="info-value" style="font-family:monospace;font-size:16px">${actionDisplay}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Reward</span>
          <span class="info-value"><span class="reward-badge ${rewCls}">${rew != null ? rew.toFixed(2) : '—'}</span>
          ${cpDelta != null ? `<span style="font-size:12px;color:#8888aa;margin-left:8px">(${cpDelta >= 0 ? '+' : ''}${cpDelta} cp)</span>` : ''}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Status</span>
          <span class="info-value">${statusLabel(s)}</span>
        </div>
        ${s.terminated && obs.game_result ? `<div class="info-row"><span class="info-label">Result</span><span class="info-value">${obs.game_result}</span></div>` : ''}
        ${historyHtml ? `<div class="history-line">${historyHtml}</div>` : ''}
      </div>
      <div class="reasoning">${escHtml(s.reasoning || '')}</div>
    </div>
    <nav>
      ${episodes.length > 1 ? `<select class="episode-select" id="epSelect">${episodes.map((_,i) => `<option value="${i}"${i===currentEp?' selected':''}>Episode ${i+1}</option>`).join('')}</select>` : ''}
      <button id="startBtn" ${currentStep===0?'disabled':''}>⏮</button>
      <button id="prevBtn" ${currentStep===0?'disabled':''}>← Prev</button>
      <span class="step-indicator">${currentStep+1} / ${steps.length}</span>
      <button id="nextBtn" ${currentStep>=steps.length-1?'disabled':''}>Next →</button>
      <button id="endBtn" ${currentStep>=steps.length-1?'disabled':''}>⏭</button>
    </nav>
  `;

  document.getElementById('prevBtn')?.addEventListener('click', () => { if (currentStep > 0) { currentStep--; renderStepUI(); }});
  document.getElementById('nextBtn')?.addEventListener('click', () => { if (currentStep < steps.length-1) { currentStep++; renderStepUI(); }});
  document.getElementById('startBtn')?.addEventListener('click', () => { currentStep = 0; renderStepUI(); });
  document.getElementById('endBtn')?.addEventListener('click', () => { currentStep = steps.length-1; renderStepUI(); });
  document.getElementById('epSelect')?.addEventListener('change', e => { currentEp = parseInt(e.target.value); currentStep = 0; renderStepUI(); });
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function loadReplaySync() {
  // Try inline data from script tag first (works with file://)
  const script = document.getElementById('replay-data');
  if (script) {
    try { return JSON.parse(script.textContent); } catch(e) {}
  }
  return null;
}

async function loadReplayFetch(path) {
  const resp = await fetch(path);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.json();
}

async function init() {
  // Try inline data first
  replay = loadReplaySync();
  if (replay) { render(); return; }

  // Try fetch paths
  const paths = [
    'data/replay.json',
    '../showcase/data/replay.json',
    'showcase/data/replay.json',
    'replay.json',
  ];
  for (const p of paths) {
    try {
      replay = await loadReplayFetch(p);
      break;
    } catch(e) {}
  }
  if (!replay) {
    document.getElementById('mainContent').innerHTML = `<div class="no-replay"><h2>Replay not found</h2><p style="margin-bottom:8px">Open the showcase with a local server:</p><p style="margin-top:8px"><code style="background:#2a2a3a;padding:6px 10px;border-radius:4px;font-size:14px">cd showcase && python3 -m http.server 8080</code></p><p style="margin-top:12px">Then open <a href="http://localhost:8080" style="color:#4361ee">http://localhost:8080</a></p><p style="margin-top:12px">Or export a run:<br><code style="background:#2a2a3a;padding:6px 10px;border-radius:4px;font-size:13px">mesocosm run export RUN_ID -o showcase/data/replay.json</code></p></div>`;
    return;
  }

  render();
}

function render() {

  const info = document.getElementById('runInfo');
  if (replay.run) {
    info.textContent = `Run: ${replay.run.id || replay.run.run_id || ''}  ·  Domain: ${replay.domain_name || replay.domain_id || ''}  ·  ${Object.keys(replay.replay || {}).length} episode(s)`;
  }

  const replayData = replay.replay || {};
  const keys = Object.keys(replayData);
  if (!keys.length) {
    document.getElementById('mainContent').innerHTML = '<div class="no-replay"><h2>No episodes in replay</h2></div>';
    return;
  }

  episodes = keys.map(k => replayData[k]);
  currentEp = 0;
  currentStep = 0;
  renderStepUI();
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') {
    const btn = document.getElementById('prevBtn');
    if (btn && !btn.disabled) btn.click();
  }
  if (e.key === 'ArrowRight') {
    const btn = document.getElementById('nextBtn');
    if (btn && !btn.disabled) btn.click();
  }
  if (e.key === 'Home' || e.key === 'PageUp') {
    const btn = document.getElementById('startBtn');
    if (btn && !btn.disabled) btn.click();
  }
  if (e.key === 'End' || e.key === 'PageDown') {
    const btn = document.getElementById('endBtn');
    if (btn && !btn.disabled) btn.click();
  }
});

init();
</script>
</body>
</html>
