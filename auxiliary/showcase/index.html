<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Player — Showcase</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #1a1a2e; color: #e0e0f0; line-height: 1.5;
  min-height: 100vh;
  display: flex; flex-direction: column;
}
header {
  background: #16213e; padding: 20px 24px; border-bottom: 1px solid #2a2a4a;
}
header h1 { font-size: 20px; font-weight: 600; }
header .subtitle { font-size: 13px; color: #8888aa; }
main {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  padding: 24px; max-width: 900px; margin: 0 auto; width: 100%;
}
.board-section {
  background: #16213e; border-radius: 12px; padding: 24px;
  border: 1px solid #2a2a4a;
}
.board-row {
  display: flex; align-items: center; gap: 0;
}
.coord-rank {
  display: flex; flex-direction: column; justify-content: space-around;
  padding: 0 6px; font-size: 11px; color: #666; width: 16px;
  align-items: center;
}
.chess-board {
  display: grid;
  grid-template-columns: repeat(8, 48px);
  grid-template-rows: repeat(8, 48px);
  border: 2px solid #2a2a4a; border-radius: 4px; overflow: hidden;
}
.square {
  width: 48px; height: 48px;
  display: flex; align-items: center; justify-content: center;
  font-size: 34px; line-height: 1; user-select: none;
}
.square.light { background: #f0d9b5; }
.square.dark { background: #b58863; }
.square.highlight { box-shadow: inset 0 0 0 3px #ffd700; }
.coord-file {
  display: flex; justify-content: space-around; padding: 4px 0 0;
  font-size: 11px; color: #666;
}
.coord-file span { width: 48px; text-align: center; }
.info-panel { margin-top: 16px; }
.info-row { display: flex; gap: 20px; margin-bottom: 6px; font-size: 14px; }
.info-label { color: #8888aa; min-width: 70px; }
.info-value { font-weight: 500; color: #e0e0f0; }
.reasoning {
  margin-top: 12px; padding: 12px; background: #0f3460;
  border-radius: 8px; font-size: 14px; line-height: 1.6;
  color: #c0c0e0; border-left: 3px solid #4361ee;
}
.reasoning::before {
  content: "Model reasoning"; display: block;
  font-size: 11px; color: #8888aa; margin-bottom: 6px;
}
nav {
  display: flex; align-items: center; gap: 12px;
  margin-top: 20px; justify-content: center;
}
nav button {
  font-family: inherit; font-size: 13px; padding: 8px 20px;
  border-radius: 6px; border: 1px solid #2a2a4a; background: #16213e;
  color: #e0e0f0; cursor: pointer; transition: all .15s;
}
nav button:hover { background: #0f3460; border-color: #4361ee; }
nav button:disabled { opacity: .4; cursor: not-allowed; }
nav button:active { transform: scale(.97); }
.step-indicator { font-size: 14px; color: #8888aa; min-width: 80px; text-align: center; }
.reward-badge {
  display: inline-block; padding: 2px 10px; border-radius: 10px;
  font-size: 12px; font-weight: 600;
}
.reward-badge.pos { background: #1a3a2a; color: #4ecdc4; }
.reward-badge.neg { background: #3a1a1a; color: #ff6b6b; }
.reward-badge.zero { background: #2a2a3a; color: #8888aa; }
.pieces-legend {
  display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px;
  font-size: 12px; color: #8888aa;
}
.pieces-legend span { display: flex; align-items: center; gap: 4px; }
.pieces-legend .piece-char { font-size: 18px; }
</style>
</head>
<body>
<header>
  <h1>♚ Chess Player</h1>
  <div class="subtitle">Model showcase — Scholar's Mate</div>
</header>
<main>
  <div class="board-section">
    <div class="board-row">
      <div class="coord-rank" id="coordRank"></div>
      <div>
        <div class="chess-board" id="board"></div>
        <div class="coord-file" id="coordFile"></div>
      </div>
    </div>
    <div class="info-panel">
      <div class="info-row"><span class="info-label">Move</span><span class="info-value" id="moveNum"></span></div>
      <div class="info-row"><span class="info-label">Turn</span><span class="info-value" id="turnDisplay"></span></div>
      <div class="info-row"><span class="info-label">Action</span><span class="info-value" id="actionDisplay"></span></div>
      <div class="info-row"><span class="info-label">Reward</span><span class="info-value" id="rewardDisplay"></span></div>
      <div class="reasoning" id="reasoningDisplay"></div>
    </div>
  </div>
  <nav>
    <button id="prevBtn" disabled>← Prev</button>
    <span class="step-indicator" id="stepIndicator">1 / 7</span>
    <button id="nextBtn">Next →</button>
  </nav>
  <div class="pieces-legend">
    <span><span class="piece-char">♔</span> White</span>
    <span><span class="piece-char">♚</span> Black</span>
    <span><span class="piece-char" style="color:#ffd700">▣</span> Last move</span>
  </div>
</main>

<script>
const PIECES = {
  'K': '♔','Q': '♕','R': '♖','B': '♗','N': '♘','P': '♙',
  'k': '♚','q': '♛','r': '♜','b': '♝','n': '♞','p': '♟',
};
const FILES = ['a','b','c','d','e','f','g','h'];
const RANKS = ['8','7','6','5','4','3','2','1'];

let replay = null;
let currentStep = 0;

function fenToBoard(fen) {
  const pos = fen.split(' ')[0], ranks = pos.split('/'), board = [];
  for (const rank of ranks) {
    const row = [];
    for (const ch of rank) {
      if (ch >= '1' && ch <= '8') for (let i=0; i<parseInt(ch); i++) row.push(null);
      else row.push(ch);
    }
    board.push(row);
  }
  return board;
}

function lastSquare(san) {
  if (!san) return null;
  const m = san.match(/[a-h][1-8]/);
  return m ? m[0] : null;
}

function renderBoard(fen, lastSan) {
  const board = fenToBoard(fen);
  const hl = lastSquare(lastSan);
  let html = '';
  for (let r=0; r<8; r++) {
    for (let f=0; f<8; f++) {
      const light = (r + f) % 2 === 0;
      const sq = FILES[f] + RANKS[r];
      const piece = board[r][f];
      html += `<div class="square ${light?'light':'dark'}${sq===hl?' highlight':''}">`;
      if (piece) html += PIECES[piece] || piece;
      html += '</div>';
    }
  }
  return html;
}

function renderCoordRanks() {
  return RANKS.map(r => `<span>${r}</span>`).join('');
}

function renderCoordFiles() {
  return FILES.map(f => `<span>${f}</span>`).join('');
}

function updateUI() {
  if (!replay) return;
  const steps = Object.values(replay.replay)[0];
  const s = steps[currentStep];
  const obs = s.observation || {};
  const fen = obs.fen || '';

  document.getElementById('board').innerHTML = renderBoard(fen, s.action);
  document.getElementById('coordRank').innerHTML = renderCoordRanks();
  document.getElementById('coordFile').innerHTML = renderCoordFiles();

  const turn = obs.turn || '';
  const turnColor = turn.toLowerCase() === 'white' ? '♔' : '♚';
  document.getElementById('turnDisplay').textContent = `${turnColor} ${turn}`;
  document.getElementById('moveNum').textContent = `#${s.step}`;
  document.getElementById('actionDisplay').textContent = s.action || '—';

  const rew = s.reward;
  const rewEl = document.getElementById('rewardDisplay');
  if (rew == null) {
    rewEl.innerHTML = '<span class="reward-badge zero">—</span>';
  } else {
    const cls = rew > 0 ? 'pos' : rew < 0 ? 'neg' : 'zero';
    rewEl.innerHTML = `<span class="reward-badge ${cls}">${rew.toFixed(2)}</span>`;
  }

  document.getElementById('reasoningDisplay').textContent = s.reasoning || '';
  document.getElementById('stepIndicator').textContent = `${currentStep+1} / ${steps.length}`;
  document.getElementById('prevBtn').disabled = currentStep === 0;
  document.getElementById('nextBtn').disabled = currentStep >= steps.length - 1;
}

async function init() {
  const resp = await fetch('replay.json');
  replay = await resp.json();
  updateUI();
}

document.getElementById('prevBtn').addEventListener('click', () => {
  if (currentStep > 0) { currentStep--; updateUI(); }
});
document.getElementById('nextBtn').addEventListener('click', () => {
  const total = Object.values(replay.replay)[0].length;
  if (currentStep < total - 1) { currentStep++; updateUI(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') document.getElementById('prevBtn').click();
  if (e.key === 'ArrowRight') document.getElementById('nextBtn').click();
});

init();
</script>
</body>
</html>
